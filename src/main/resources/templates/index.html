<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý nhân viên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 600px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .project-filter {
            margin-bottom: 16px;
        }

        input,
        select,
        button {
            padding: 7px;
        }

        table {
            width: 100%;
            max-width: 900px;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(2px);
        }

        .loading-overlay[hidden] {
            display: none;
        }

        .loading-spinner {
            width: 42px;
            height: 42px;
            border: 5px solid #d9d9d9;
            border-top-color: #1677ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-spinner {
                animation-duration: 1.5s;
            }
        }

    </style>
</head>

<body>
    <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" hidden>
        <div class="loading-spinner" aria-hidden="true"></div>
        <span>Đang tải dữ liệu...</span>
    </div>

    <main>
        <h1 id="form-title">Thêm nhân viên</h1>
        <form class="form" id="staff-form">
            <div class="field">
                <label for="name">Tên</label>
                <input id="name" name="name" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div class="field">
                <label for="projectId">Dự án</label>
                <select id="projectId" name="projectId" required>
                    <option value="">-- Chọn dự án --</option>
                </select>
            </div>
            <div class="actions">
                <button type="submit">Lưu</button>
                <button type="button" onclick="onResetForm()">Hủy</button>
            </div>
        </form>

        <h2>Danh sách nhân viên</h2>
        <div class="project-filter">
            <label for="project-filter">Dự án</label>
            <select id="project-filter" onchange="onChangeProject(this.value)">
                <option value="">Tất cả dự án</option>
            </select>
        </div>
        <table border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>Dự án</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="staff-rows"></tbody>
        </table>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const staffRows = document.getElementById("staff-rows");
        const staffForm = document.getElementById("staff-form");
        const projectSelect = staffForm.elements.projectId;
        const projectFilter = document.getElementById("project-filter");
        let projectNames = [];
        let editingStaffId = null;

        const onSetLoading = (isLoading) => {
            document.getElementById("loading-overlay").hidden = !isLoading;
        };

        const onResetForm = () => {
            editingStaffId = null;
            staffForm.reset();
            document.getElementById("form-title").textContent = "Thêm nhân viên";
        };

        const fetchProjects = async () => {
            const { data } = await projectApi.list();
            projectNames = data;
            console.log({projectNames});
            const projectOptions = data.map((project) =>
                `<option value="${project.id}">${project.name}</option>`
            ).join("");

            projectSelect.innerHTML = `
                <option value="">-- Chọn dự án --</option>
                ${projectOptions}
            `;
            projectFilter.innerHTML = `
                <option value="">Tất cả dự án</option>
                ${projectOptions}
            `;
        };

        const onChangeProject = async (projectId) => {
            await fetchStaffs(projectId);
        };

        const fetchStaffs = async (projectId = "") => {
            try {
                const { data } = projectId
                    ? await projectApi.detail(projectId)
                        .then((response) => ({ data: response.data.staffs }))
                    : await staffApi.list();

                if (!data || data.length === 0) {
                    staffRows.innerHTML = `<tr><td colspan="5">Không có dữ liệu</td></tr>`;
                    return;
                }
                console.log({data});
                staffRows.innerHTML = data.map((staff) => `
                    <tr>
                        <td>${staff.id}</td>
                        <td>${staff.name}</td>
                        <td>${staff.email}</td>
                        <td>${projectNames.find((project) => project.id === staff.projectId)?.name}</td>
                        <td>
                            <button type="button" onclick="onEditStaff(${staff.id})">Sửa</button>
                            <button type="button" onclick="onDeleteStaff(${staff.id})">Xóa</button>
                        </td>
                    </tr>
                `).join("");
            } catch (error) {
                staffRows.innerHTML = `<tr><td colspan="5">Không thể tải dữ liệu</td></tr>`;
            }
        };

        const onEditStaff = async (id) => {
            onSetLoading(true);
            try {
                const { data } = await staffApi.detail(id);
                editingStaffId = id;
                document.getElementById("form-title").textContent = "Sửa nhân viên";
                staffForm.elements.name.value = data.name;
                staffForm.elements.email.value = data.email;
                staffForm.elements.projectId.value = data.projectId;
            } catch (error) {
                console.error(error);
            } finally {
                onSetLoading(false);
            }
        };

        const onDeleteStaff = async (id) => {
            const confirmDelete = window.confirm("Bạn có chắc muốn xoá không?");
            if (!confirmDelete) return;

            onSetLoading(true);
            try {
                await staffApi.remove(id);
                if (editingStaffId === id) onResetForm();
                await fetchStaffs(projectFilter.value);
            } catch (error) {
                console.error(error);
            } finally {
                onSetLoading(false);
            }
        };

        staffForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const data = {
                name: staffForm.elements.name.value.trim(),
                email: staffForm.elements.email.value.trim(),
                projectId: Number(staffForm.elements.projectId.value),
            };

            onSetLoading(true);
            try {
                if (editingStaffId !== null) await staffApi.update(editingStaffId, data);
                else await staffApi.create(data);

                onResetForm();
                await fetchStaffs(projectFilter.value);
            } catch (error) {
                console.error(error);
            } finally {
                onSetLoading(false);
            }
        });

        const onInitPage = async () => {
            onSetLoading(true);
            try {
                await fetchProjects();
                await fetchStaffs();
            } catch (error) {
                console.error(error);
            } finally {
                onSetLoading(false);
            }
        };

        onInitPage();
    </script>
</body>

</html>
