<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý nhân viên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 600px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .department-filter {
            margin-bottom: 16px;
        }

        input,
        select,
        button {
            padding: 7px;
        }

        table {
            width: 100%;
            max-width: 900px;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(2px);
        }

        .loading-overlay[hidden] {
            display: none;
        }

        .loading-spinner {
            width: 42px;
            height: 42px;
            border: 5px solid #d9d9d9;
            border-top-color: #1677ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-spinner {
                animation-duration: 1.5s;
            }
        }

    </style>
</head>

<body>
    <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" hidden>
        <div class="loading-spinner" aria-hidden="true"></div>
        <span>Đang tải dữ liệu...</span>
    </div>

    <main>
        <h1 id="form-title">Thêm nhân viên</h1>
        <form class="form" id="staff-form">
            <div class="field">
                <label for="name">Tên</label>
                <input id="name" name="name" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div class="field">
                <label for="departmentId">Phòng ban</label>
                <select id="departmentId" name="departmentId" required>
                    <option value="">-- Chọn phòng ban --</option>
                </select>
            </div>
            <div class="actions">
                <button type="submit">Lưu</button>
                <button type="button" onclick="onResetForm()">Hủy</button>
            </div>
        </form>

        <h2>Danh sách nhân viên</h2>
        <div class="department-filter">
            <label for="department-filter">Phòng ban</label>
            <select id="department-filter" onchange="onChangeDepartment(this.value)">
                <option value="">Tất cả phòng ban</option>
            </select>
        </div>
        <table border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>Phòng ban</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="staff-rows"></tbody>
        </table>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const staffRows = document.getElementById("staff-rows");
        const staffForm = document.getElementById("staff-form");
        const departmentSelect = staffForm.elements.departmentId;
        const departmentFilter = document.getElementById("department-filter");
        let editingStaffId = null;

        const onSetLoading = (isLoading) => {
            document.getElementById("loading-overlay").hidden = !isLoading;
        };

        const onResetForm = () => {
            editingStaffId = null;
            staffForm.reset();
            document.getElementById("form-title").textContent = "Thêm nhân viên";
        };

        const fetchDepartments = async () => {
            const { data } = await departmentApi.list();
            const departmentOptions = data.map((department) =>
                `<option value="${department.id}">${department.name}</option>`
            ).join("");

            departmentSelect.innerHTML = `
                <option value="">-- Chọn phòng ban --</option>
                ${departmentOptions}
            `;
            departmentFilter.innerHTML = `
                <option value="">Tất cả phòng ban</option>
                ${departmentOptions}
            `;
        };

        const onChangeDepartment = async (departmentId) => {
            await fetchStaffs(departmentId);
        };

        const fetchStaffs = async (departmentId = "") => {
            try {
                const { data } = departmentId
                    ? await departmentApi.detail(departmentId)
                        .then((response) => ({ data: response.data.staffs }))
                    : await staffApi.list();

                if (!data || data.length === 0) {
                    staffRows.innerHTML = `<tr><td colspan="5">Không có dữ liệu</td></tr>`;
                    return;
                }

                staffRows.innerHTML = data.map((staff) => `
                    <tr>
                        <td>${staff.id}</td>
                        <td>${staff.name}</td>
                        <td>${staff.email}</td>
                        <td>${staff.departmentId}</td>
                        <td>
                            <button type="button" onclick="onEditStaff(${staff.id})">Sửa</button>
                            <button type="button" onclick="onDeleteStaff(${staff.id})">Xóa</button>
                        </td>
                    </tr>
                `).join("");
            } catch (error) {
                staffRows.innerHTML = `<tr><td colspan="5">Không thể tải dữ liệu</td></tr>`;
            }
        };

        const onEditStaff = async (id) => {
            onSetLoading(true);
            try {
                const { data } = await staffApi.detail(id);
                editingStaffId = id;
                document.getElementById("form-title").textContent = "Sửa nhân viên";
                staffForm.elements.name.value = data.name;
                staffForm.elements.email.value = data.email;
                staffForm.elements.departmentId.value = data.departmentId;
            } catch (error) {
                console.error(error);
            } finally {
                onSetLoading(false);
            }
        };

        const onDeleteStaff = async (id) => {
            const confirmDelete = window.confirm("Bạn có chắc muốn xoá không?");
            if (!confirmDelete) return;

            onSetLoading(true);
            try {
                await staffApi.remove(id);
                if (editingStaffId === id) onResetForm();
                await fetchStaffs(departmentFilter.value);
            } catch (error) {
                console.error(error);
            } finally {
                onSetLoading(false);
            }
        };

        staffForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const data = {
                name: staffForm.elements.name.value.trim(),
                email: staffForm.elements.email.value.trim(),
                departmentId: Number(staffForm.elements.departmentId.value),
            };

            onSetLoading(true);
            try {
                if (editingStaffId !== null) await staffApi.update(editingStaffId, data);
                else await staffApi.create(data);

                onResetForm();
                await fetchStaffs(departmentFilter.value);
            } catch (error) {
                console.error(error);
            } finally {
                onSetLoading(false);
            }
        });

        const onInitPage = async () => {
            onSetLoading(true);
            try {
                await fetchDepartments();
                await fetchStaffs();
            } catch (error) {
                staffRows.innerHTML = `<tr><td colspan="5">Không thể tải dữ liệu</td></tr>`;
            } finally {
                onSetLoading(false);
            }
        };

        onInitPage();
    </script>
</body>

</html>
